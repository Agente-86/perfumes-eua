<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Teste de fala</title>
<style>
:root{--bg:#f4f5f7;--ink:#16202c;--muted:#5d6876;--card:#fff;--line:#dfe3e8;--accent:#1f6f5c}
@media (prefers-color-scheme: dark){:root{--bg:#11161d;--ink:#e8ecf1;--muted:#9aa5b3;--card:#1a212a;--line:#2b3440;--accent:#5cc2a6}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px}
h1{font-size:1.3rem;margin:0 0 6px}
p{color:var(--muted);margin:0 0 14px;font-size:.92rem}
button{display:block;width:100%;font:inherit;font-weight:600;padding:16px;margin:0 0 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
pre{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:.85rem;min-height:120px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Teste de fala</h1>
  <p>Toque em cada botão e veja o que aparece no quadro abaixo. Sem nada do catálogo: só o pedido de fala do navegador.</p>
  <button id="b1">1. Falar "Creed, Aventus" (inglês dos EUA)</button>
  <button id="b2">2. Falar "Creed, Aventus" (voz padrão, sem idioma)</button>
  <button id="b3">3. Falar "Olá, teste de voz" (português)</button>
  <pre id="log"></pre>
</div>
<script>
// Página de teste (07/11/2026): o mesmo pedido de fala que o catálogo fazia até 06/11 (cancel + speak no clique),
// para separar defeito do catálogo de defeito do navegador/aparelho.
const log = document.getElementById("log"), s = window.speechSynthesis;
const L = t => { log.textContent = t + "\n" + log.textContent; };
L(`Navegador: ${navigator.userAgent}`);
L(`Fala disponível: ${!!(s && window.SpeechSynthesisUtterance)}`);
function vozes(){ const v = s ? s.getVoices() : []; L(`Vozes: ${v.length} (inglês: ${v.filter(x => /^en/i.test(x.lang)).map(x => x.name + (x.default ? " *" : "")).slice(0, 6).join(", ") || "nenhuma"})`); }
if (s){ vozes(); s.onvoiceschanged = vozes; }
function falar(txt, lang, nome){
  if (!s) { L("Este navegador não tem fala."); return; }
  const u = new SpeechSynthesisUtterance(txt);
  if (lang) u.lang = lang;
  u.onstart = () => L(`${nome}: começou a falar`);
  u.onend = () => L(`${nome}: terminou`);
  u.onerror = e => L(`${nome}: ERRO ${e.error}`);
  window.__u = u;
  s.cancel(); s.speak(u);
  L(`${nome}: pedido enviado`);
}
document.getElementById("b1").onclick = () => falar("Creed, Aventus", "en-US", "Botão 1");
document.getElementById("b2").onclick = () => falar("Creed, Aventus", "", "Botão 2");
document.getElementById("b3").onclick = () => falar("Olá, teste de voz", "pt-BR", "Botão 3");
</script>
</body>
</html>
